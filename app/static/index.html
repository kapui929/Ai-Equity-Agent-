<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Equity Research Agent</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);min-height:100vh;color:#fff}
        .container{max-width:800px;margin:0 auto;padding:40px 20px}
        h1{text-align:center;font-size:2.5em;margin-bottom:10px;background:linear-gradient(90deg,#00d2ff,#3a7bd5);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .subtitle{text-align:center;color:#888;margin-bottom:40px}
        .search-box{display:flex;gap:10px;margin-bottom:30px}
        input,select{padding:15px;border:1px solid #444;border-radius:10px;background:rgba(255,255,255,0.1);color:#fff;font-size:16px;outline:none}
        input:focus,select:focus{border-color:#3a7bd5}
        input{flex:1}select{width:120px}
        .btn{padding:15px 30px;border:none;border-radius:10px;color:#fff;font-size:16px;cursor:pointer;font-weight:bold}
        .btn-blue{background:linear-gradient(90deg,#00d2ff,#3a7bd5)}
        .btn-purple{background:linear-gradient(90deg,#a855f7,#7c3aed)}
        .btn:hover{opacity:0.9}.btn:disabled{opacity:0.5;cursor:not-allowed}
        .result-card{background:rgba(255,255,255,0.05);border:1px solid #333;border-radius:15px;padding:30px;margin-top:20px;display:none}
        .stock-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;padding-bottom:15px;border-bottom:1px solid #333}
        .stock-name{font-size:1.5em;font-weight:bold}
        .stock-price{font-size:1.8em;color:#00d2ff}
        .scores{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:25px}
        .score-box{background:rgba(255,255,255,0.05);border-radius:10px;padding:20px;text-align:center}
        .score-label{font-size:0.9em;color:#888;margin-bottom:8px}
        .score-value{font-size:2.2em;font-weight:bold}
        .score-good{color:#4CAF50}.score-mid{color:#FF9800}.score-bad{color:#f44336}
        .breakdown{background:rgba(255,255,255,0.03);border-radius:10px;padding:20px}
        .breakdown h3{margin-bottom:15px;color:#aaa}
        .metric-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
        .metric-name{color:#aaa}.metric-value{font-weight:bold}
        .loading{text-align:center;padding:40px;display:none}
        .spinner{border:3px solid #333;border-top:3px solid #3a7bd5;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:0 auto 15px}
        @keyframes spin{to{transform:rotate(360deg)}}
        .error{background:rgba(244,67,54,0.1);border:1px solid #f44336;border-radius:10px;padding:20px;text-align:center;display:none;color:#f44336}
        .quick-links{display:flex;gap:10px;justify-content:center;margin-bottom:30px;flex-wrap:wrap}
        .quick-btn{padding:8px 16px;background:rgba(255,255,255,0.1);border:1px solid #444;border-radius:20px;color:#ccc;cursor:pointer;font-size:14px}
        .quick-btn:hover{background:rgba(58,123,213,0.3);border-color:#3a7bd5}
        .ai-report{background:rgba(168,85,247,0.1);border:1px solid #a855f7;border-radius:10px;padding:20px;margin-top:20px;display:none;white-space:pre-wrap;line-height:1.6}
        .ai-report h3{color:#a855f7;margin-bottom:10px}
        .ai-btn-row{text-align:center;margin-top:20px}
    </style>
</head>
<body>
<div class="container">
    <h1>AI Equity Research Agent</h1>
    <p class="subtitle">Analyze global stocks - US, TW, HK, Crypto</p>
    <div class="quick-links">
        <span class="quick-btn" onclick="quickSearch('AAPL','US')">AAPL</span>
        <span class="quick-btn" onclick="quickSearch('GOOGL','US')">GOOGL</span>
        <span class="quick-btn" onclick="quickSearch('TSLA','US')">TSLA</span>
        <span class="quick-btn" onclick="quickSearch('2330','TW')">2330.TW</span>
        <span class="quick-btn" onclick="quickSearch('0700','HK')">0700.HK</span>
        <span class="quick-btn" onclick="quickSearch('BTC','CRYPTO')">BTC</span>
    </div>
    <div class="search-box">
        <input type="text" id="symbol" placeholder="Enter stock symbol (e.g. AAPL, 2330)">
        <select id="market"><option value="US">US</option><option value="TW">TW</option><option value="HK">HK</option><option value="CRYPTO">Crypto</option></select>
        <button class="btn btn-blue" id="analyzeBtn" onclick="analyze()">Analyze</button>
    </div>
    <div class="loading" id="loading"><div class="spinner"></div><p>Analyzing...</p></div>
    <div class="error" id="error"></div>
    <div class="result-card" id="result">
        <div class="stock-header">
            <div><div class="stock-name" id="stockName"></div><div style="color:#888" id="stockSector"></div></div>
            <div class="stock-price" id="stockPrice"></div>
        </div>
        <div class="scores">
            <div class="score-box"><div class="score-label">Quality Score</div><div class="score-value" id="qualityScore"></div></div>
            <div class="score-box"><div class="score-label">Valuation Score</div><div class="score-value" id="valuationScore"></div></div>
            <div class="score-box"><div class="score-label">Overall Score</div><div class="score-value" id="overallScore"></div></div>
        </div>
        <div class="breakdown">
            <h3>Quality Breakdown</h3><div id="qualityBreakdown"></div>
            <h3 style="margin-top:20px">Valuation Breakdown</h3><div id="valuationBreakdown"></div>
        </div>
        <div class="ai-btn-row">
            <button class="btn btn-purple" id="aiBtn" onclick="getAIReport()">Generate AI Report</button>
        </div>
        <div class="ai-report" id="aiReport"><h3>AI Analysis Report</h3><div id="aiContent"></div></div>
    </div>
</div>
<script>
let currentSymbol='',currentMarket='';
function quickSearch(s,m){document.getElementById('symbol').value=s;document.getElementById('market').value=m;analyze()}
async function analyze(){
    const symbol=document.getElementById('symbol').value.trim();
    const market=document.getElementById('market').value;
    if(!symbol){alert('Please enter a stock symbol');return}
    currentSymbol=symbol;currentMarket=market;
    document.getElementById('loading').style.display='block';
    document.getElementById('result').style.display='none';
    document.getElementById('error').style.display='none';
    document.getElementById('aiReport').style.display='none';
    document.getElementById('analyzeBtn').disabled=true;
    try{
        const res=await fetch('/analyze?symbol='+symbol+'&market='+market);
        const data=await res.json();
        if(data.error){document.getElementById('error').textContent=data.error;document.getElementById('error').style.display='block';return}
        document.getElementById('stockName').textContent=data.symbol+' - '+data.name;
        document.getElementById('stockSector').textContent=data.sector||'';
        document.getElementById('stockPrice').textContent=(data.currency||'')+' '+(data.price||'N/A');
        setScore('qualityScore',data.quality.score);
        setScore('valuationScore',data.valuation.score);
        setScore('overallScore',data.overall_score);
        renderBreakdown('qualityBreakdown',data.quality.breakdown);
        renderBreakdown('valuationBreakdown',data.valuation.breakdown);
        document.getElementById('result').style.display='block';
    }catch(e){document.getElementById('error').textContent='Failed: '+e.message;document.getElementById('error').style.display='block'}
    finally{document.getElementById('loading').style.display='none';document.getElementById('analyzeBtn').disabled=false}
}
async function getAIReport(){
    document.getElementById('aiBtn').disabled=true;
    document.getElementById('aiBtn').textContent='Generating...';
    try{
        const res=await fetch('/analyze?symbol='+currentSymbol+'&market='+currentMarket+'&ai_report=true');
        const data=await res.json();
        document.getElementById('aiContent').textContent=data.ai_report||'No report generated';
        document.getElementById('aiReport').style.display='block';
    }catch(e){document.getElementById('aiContent').textContent='Error: '+e.message;document.getElementById('aiReport').style.display='block'}
    finally{document.getElementById('aiBtn').disabled=false;document.getElementById('aiBtn').textContent='Generate AI Report'}
}
function setScore(id,score){const el=document.getElementById(id);el.textContent=score;el.className='score-value '+(score>=60?'score-good':score>=40?'score-mid':'score-bad')}
function renderBreakdown(id,breakdown){
    const c=document.getElementById(id);c.innerHTML='';
    const labels={roe:'ROE (Return on Equity)',profit_margin:'Profit Margin',debt_to_equity:'Debt to Equity',revenue_growth:'Revenue Growth',pe_ratio:'P/E Ratio',pb_ratio:'P/B Ratio',dividend_yield:'Dividend Yield'};
    for(const[key,val]of Object.entries(breakdown)){const row=document.createElement('div');row.className='metric-row';row.innerHTML='<span class="metric-name">'+(labels[key]||key)+'</span><span class="metric-value">'+val.value+' (Score: '+val.score+')</span>';c.appendChild(row)}
}
document.getElementById('symbol').addEventListener('keypress',function(e){if(e.key==='Enter')analyze()});
</script>
</body>
</html>
